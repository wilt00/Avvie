name: Windows release

on:
  push:
    branches: [ personal ]  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  ASSET_NAME: avvie-windows-x86_64.zip

jobs:
  build:
    name: Build portable Windows archive
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install the UCRT64 runtime and build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pip

      - name: Determine release metadata
        id: metadata
        run: |
          set -euo pipefail
          upstream_version=$(sed -nE 's/^version = "([0-9]+(\.[0-9]+)*)"/\1/p' src/main.py | head -n 1)
          if [[ ! "$upstream_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Could not read a numeric application version from src/main.py" >&2
            exit 1
          fi

          version="${upstream_version}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build portable directory
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          stage="$PWD/dist/Avvie"
          rm -rf "$PWD/dist"
          mkdir -p "$stage/runtime" "$stage/app/avvie/res" "$stage/app/locale"

          # Keep a self-contained native UCRT64 runtime. Remove development-only
          # files, but retain DLLs, Python, typelibs, schemas, fonts and licenses.
          cp -a /ucrt64/. "$stage/runtime/"
          rm -rf \
            "$stage/runtime/include" \
            "$stage/runtime/lib/cmake" \
            "$stage/runtime/lib/pkgconfig" \
            "$stage/runtime/share/aclocal" \
            "$stage/runtime/share/doc" \
            "$stage/runtime/share/gir-1.0" \
            "$stage/runtime/share/gtk-doc" \
            "$stage/runtime/share/info" \
            "$stage/runtime/share/man" \
            "$stage/runtime/share/pkgconfig" \
            "$stage/runtime/share/vala"
          find "$stage/runtime/lib" -maxdepth 1 -type f \
            \( -name '*.a' -o -name '*.dll.a' -o -name '*.la' \) -delete

          cp src/__init__.py src/main.py "$stage/app/avvie/"
          cp src/res/* "$stage/app/avvie/res/"
          cp packaging/windows/launch.py "$stage/app/"
          cp packaging/windows/Avvie.cmd LICENSE README.md "$stage/"
          cp packaging/windows/Avvie.ico "$stage/"

          # GTK owns the actual application window (in pythonw.exe), so it needs
          # a themed window icon in addition to the icon embedded in Avvie.exe.
          icon_dir="$stage/runtime/share/icons/hicolor/scalable/apps"
          mkdir -p "$icon_dir"
          cp data/icons/hicolor/scalable/apps/com.github.taiko2k.avvie.svg "$icon_dir/"
          gtk4-update-icon-cache --force "$stage/runtime/share/icons/hicolor"

          python -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --no-deps \
            --target "$stage/app" \
            piexif==1.1.3

          while read -r language; do
            language=${language%$'\r'}
            [[ -z "$language" || "$language" == \#* ]] && continue
            mkdir -p "$stage/app/locale/$language/LC_MESSAGES"
            msgfmt "po/$language.po" \
              -o "$stage/app/locale/$language/LC_MESSAGES/avvie.mo"
          done < po/LINGUAS

          # Include the same precompiled application modules as earlier releases.
          python -m py_compile "$stage/app/launch.py" "$stage/app/avvie/main.py"

          cat > "$stage/BUILD.txt" <<EOF
          Avvie $RELEASE_VERSION
          Source commit: $GITHUB_SHA
          Architecture: x86_64
          Runtime: MSYS2 UCRT64
          EOF

      - name: Build the windowless launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'dist\Avvie'
          $source = Join-Path $PWD 'packaging\windows'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'MSVC C++ tools not installed' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $resource = Join-Path $env:RUNNER_TEMP 'Avvie.res'
          $rc = Join-Path $source 'Avvie.rc'
          $c = Join-Path $source 'launcher.c'
          $exe = Join-Path $stage 'Avvie.exe'
          $command = "call `"$vcvars`" >nul && rc /nologo /i `"$stage`" /fo `"$resource`" `"$rc`" && cl /nologo /W4 /WX /O2 /MT `"$c`" `"$resource`" ole32.lib shell32.lib user32.lib /link /SUBSYSTEM:WINDOWS /OUT:`"$exe`""
          Push-Location $env:RUNNER_TEMP
          try {
            & $env:ComSpec /d /c $command
            if ($LASTEXITCODE -ne 0) { throw 'Native launcher build failed' }
          } finally {
            Pop-Location
          }
          if (!(Test-Path $exe)) { throw 'Missing Avvie.exe' }

      # Upload the exact archive before any runtime tests, so failed tests still
      # leave a downloadable artifact for local reproduction. Release remains
      # gated on the entire build job succeeding.
      - name: Create archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD $env:ASSET_NAME
          if (Test-Path $archive) { Remove-Item $archive -Force }
          & 7z a -tzip -mx=9 $archive '.\dist\Avvie\*'
          if ($LASTEXITCODE -ne 0) { throw '7-Zip failed to create the archive' }
          $checksum = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$checksum  $env:ASSET_NAME" | Set-Content -NoNewline -Encoding ascii "$archive.sha256"

      - name: Upload archive for debugging and release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ steps.metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256

      - name: Test packaged Python modules
        run: |
          set -euo pipefail
          stage="$PWD/dist/Avvie"
          export PATH="$stage/runtime/bin:$PATH"
          export PYTHONHOME="$stage/runtime"
          export PYTHONPATH="$stage/app"
          export PYGI_DLL_PATH="$(cygpath -w "$stage/runtime/bin")"
          export GI_TYPELIB_PATH="$stage/runtime/lib/girepository-1.0"
          export XDG_DATA_DIRS="$stage/runtime/share"
          export GSETTINGS_SCHEMA_DIR="$stage/runtime/share/glib-2.0/schemas"

          python -m py_compile \
            "$stage/app/launch.py" \
            "$stage/app/avvie/main.py"
          python - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gdk, GdkPixbuf, Gio, GLib, Graphene, Gsk, Gtk, Pango
          import piexif
          from PIL import Image
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())
          print("libadwaita", Adw.get_major_version(), Adw.get_minor_version())
          print("Pillow", Image.__version__)
          PY
          jpegtran -version
          test -f "$stage/app/avvie/res/image-crop.svg"
          test -f "$stage/app/avvie/res/pinku.css"
          test -s "$stage/Avvie.ico"
          test -s "$stage/runtime/share/icons/hicolor/scalable/apps/com.github.taiko2k.avvie.svg"
          gtk4-update-icon-cache --validate "$stage/runtime/share/icons/hicolor"

      - name: Test relocated archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD $env:ASSET_NAME
          & 7z t $archive
          if ($LASTEXITCODE -ne 0) { throw '7-Zip archive test failed' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'Avvie relocatable smoke test'
          if (Test-Path $smokeRoot) { Remove-Item $smokeRoot -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $smokeRoot
          if (!(Test-Path (Join-Path $smokeRoot 'Avvie.ico'))) { throw 'Missing Start Menu icon' }
          $launcher = Join-Path $smokeRoot 'Avvie.exe'
          if (!(Test-Path $launcher)) { throw 'Missing native launcher' }
          # PE subsystem 2 is Windows GUI, not console (3).
          $bytes = [IO.File]::ReadAllBytes($launcher)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 0x5c) -ne 2) { throw 'Launcher is not a GUI executable' }

          $runtime = Join-Path $smokeRoot 'runtime'
          $env:Path = "$(Join-Path $runtime 'bin');$env:Path"
          $env:PYTHONHOME = $runtime
          $env:PYTHONPATH = Join-Path $smokeRoot 'app'
          $env:PYGI_DLL_PATH = Join-Path $runtime 'bin'
          $env:GI_TYPELIB_PATH = Join-Path $runtime 'lib\girepository-1.0'
          $env:XDG_DATA_DIRS = Join-Path $runtime 'share'
          $env:GSETTINGS_SCHEMA_DIR = Join-Path $runtime 'share\glib-2.0\schemas'

          $configHome = Join-Path $env:RUNNER_TEMP 'Avvie config smoke test'
          if (Test-Path $configHome) { Remove-Item $configHome -Recurse -Force }
          $env:XDG_CONFIG_HOME = $configHome

          Push-Location $env:RUNNER_TEMP
          try {
            & (Join-Path $runtime 'bin\python.exe') -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; import piexif; from PIL import Image; print('relocated runtime OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Relocated runtime smoke test failed' }
            $test = Start-Process -FilePath $launcher -ArgumentList '--launcher-smoke-test' -Wait -PassThru
            if ($test.ExitCode -ne 0) { throw "Relocated launcher failed with exit code $($test.ExitCode)" }

            $appData = Join-Path $configHome 'com.github.taiko2k.avvie'
            $cacheFiles = @(Get-ChildItem (Join-Path $appData 'Cache') -Filter 'gdk-pixbuf-loaders-*.cache')
            if ($cacheFiles.Count -ne 1) { throw 'Launcher did not create exactly one pixbuf cache' }
            if (Test-Path (Join-Path $appData 'Logs\launcher.log')) {
              throw 'Launcher retained the log after a successful run'
            }
          } finally {
            Pop-Location
          }

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download tested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ needs.build.outputs.version }}
          path: release

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s "$ASSET_NAME"
          test -s "$ASSET_NAME.sha256"
          sha256sum --check "$ASSET_NAME.sha256"

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          cat > release-notes.md <<EOF
          Portable Windows x86_64 build of Avvie $RELEASE_VERSION.

          Source commit: \`$RELEASE_SHA\`

          Extract the archive and run \`Avvie.exe\` (no terminal window).
          EOF

          gh release create "$tag" \
            "release/$ASSET_NAME" \
            "release/$ASSET_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Avvie $RELEASE_VERSION" \
            --notes-file release-notes.md

      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,assets)

          test "$(jq -r '.tagName' <<<"$release")" = "$tag"
          test "$(jq -r '.targetCommitish' <<<"$release")" = "$RELEASE_SHA"
          jq -e --arg zip "$ASSET_NAME" --arg sum "$ASSET_NAME.sha256" '
            [.assets[].name] as $names |
            ($names | length) == 2 and
            ($names | index($zip)) != null and
            ($names | index($sum)) != null
          ' <<<"$release" >/dev/null
